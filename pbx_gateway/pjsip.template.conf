[global]
; PJSIP object kind; section names may be reused for different kinds.
type=global
; Product identifier sent in SIP User-Agent headers.
user_agent=Relay-PBX-Gateway

[transport-udp]
; PJSIP object kind; section names may be reused for different kinds.
type=transport
; Upstream signaling transport.
protocol=udp
; Local listener address/port; 0.0.0.0 binds all container interfaces.
bind=0.0.0.0:5060
; Treat this private subnet as local for transport address handling; repeatable.
local_net=10.0.0.0/8
; Treat this private subnet as local for transport address handling; repeatable.
local_net=172.16.0.0/12
; Treat this private subnet as local for transport address handling; repeatable.
local_net=192.168.0.0/16

[transport-tcp]
; PJSIP object kind; section names may be reused for different kinds.
type=transport
; Upstream signaling transport.
protocol=tcp
; Local listener address/port; 0.0.0.0 binds all container interfaces.
bind=0.0.0.0:5060
; Treat this private subnet as local for transport address handling; repeatable.
local_net=10.0.0.0/8
; Treat this private subnet as local for transport address handling; repeatable.
local_net=172.16.0.0/12
; Treat this private subnet as local for transport address handling; repeatable.
local_net=192.168.0.0/16

[transport-tls]
; PJSIP object kind; section names may be reused for different kinds.
type=transport
; Upstream signaling transport.
protocol=tls
; Local listener address/port; 0.0.0.0 binds all container interfaces.
bind=0.0.0.0:5061
; no disables upstream TLS certificate verification; encryption alone does not authenticate the PBX.
verify_server=no
; Allow this transport configuration to reload where supported.
allow_reload=yes

; Standards-based SIP trunk to the upstream PBX.
[upstream-auth]
; PJSIP object kind; section names may be reused for different kinds.
type=auth
; Authenticate using a username/password pair.
auth_type=userpass
; Authentication identity substituted at container startup.
username=${PBX_USERNAME}
; Authentication secret substituted at startup; keep rendered configuration private.
password=${PBX_PASSWORD}

[upstream-aor]
; PJSIP object kind; section names may be reused for different kinds.
type=aor
; Static upstream destination from PBX_HOST/PBX_PORT.
contact=sip:${PBX_HOST}:${PBX_PORT}
; Probe contact availability every 30 seconds.
qualify_frequency=30

[upstream]
; PJSIP object kind; section names may be reused for different kinds.
type=endpoint
; Reference the transport object used for signaling.
transport=transport-${PBX_TRANSPORT}
; Dialplan context for calls received from this endpoint.
context=from-upstream
; Dialplan context for out-of-dialog SIP MESSAGE requests.
message_context=from-upstream-message
; Authentication object for outbound challenges.
outbound_auth=upstream-auth
; Address-of-record object(s) containing reachable contacts.
aors=upstream-aor
; User part of upstream From identity.
from_user=${PBX_USERNAME}
; Domain part of upstream From identity.
from_domain=${PBX_HOST}
; Keep media anchored so ExternalMedia can bridge it to Node.
direct_media=no
; Digit signaling mode expected by the upstream PBX.
dtmf_mode=${PBX_DTMF_MODE}
; Clear default codecs before explicitly allowing supported codecs.
disallow=all
; Match the PCMU media bridge without transcoding.
allow=ulaw
; Send RTP toward the address/port from which it was received.
rtp_symmetric=yes
; End a call after 30 seconds without received RTP when not on hold.
rtp_timeout=30
; Allow up to 300 seconds without received RTP while on hold.
rtp_timeout_hold=300
; Use the source port for SIP response routing.
force_rport=yes
; Use received source addressing for endpoint contact reachability.
rewrite_contact=yes

[upstream-registration]
; PJSIP object kind; section names may be reused for different kinds.
type=registration
; Reference the transport object used for signaling.
transport=transport-${PBX_TRANSPORT}
; Authentication object for outbound challenges.
outbound_auth=upstream-auth
; Upstream registrar URI; transport selected separately.
server_uri=sip:${PBX_HOST}:${PBX_PORT}
; Registration AOR using PBX_AOR, independent of authentication username.
client_uri=sip:${PBX_AOR}@${PBX_HOST}
; User part advertised in registration Contact.
contact_user=${PBX_USERNAME}
; Retry registration after ordinary failure in 20 seconds.
retry_interval=20
; Retry a forbidden registration after 60 seconds.
forbidden_retry_interval=60
; Retry fatal registration failures after 30 seconds.
fatal_retry_interval=30
; no permits retries after authentication rejection.
auth_rejection_permanent=no
; Request a 300-second registration lifetime.
expiration=300
; Add registration line identification for associating inbound requests.
line=yes
; Endpoint associated with the registration for inbound routing.
endpoint=upstream
