; Configures Asterisk logging destinations and levels.
; Console output goes to the container stdout; the full file is size-capped by the entrypoint.
[general]
; Log timestamp format: ISO-like date and 24-hour time.
dateformat=%F %T
; Disable built-in rename rotation; the entrypoint enforces a 100 MiB file cap.
rotatestrategy=none

[logfiles]
; Same detail as the file log; Docker/host logging driver retains console history.
console => notice,warning,error,verbose,dtmf
; File log; verbose and DTMF may include sensitive call/digit details.
full => notice,warning,error,verbose,dtmf
