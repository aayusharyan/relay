[general]
; First UDP RTP port; must match Docker and firewall range.
rtpstart=10000
; Last UDP RTP port (inclusive); must match Docker and firewall range.
rtpend=10100
; Enable gateway ICE negotiation for browser media.
icesupport=yes
; Gateway STUN server; independent of browser PBX_ICE_SERVERS.
stunaddr=stun.l.google.com:19302
