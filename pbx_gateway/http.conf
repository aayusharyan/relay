[general]
; Enable the internal Asterisk HTTP server needed for SIP WebSocket.
enabled=yes
; Bind HTTP on all container interfaces; Compose does not publish this port.
bindaddr=0.0.0.0
; Internal HTTP/WebSocket listener port; Node proxies /ws here.
bindport=8088
; Disable Asterisk static web serving; Node serves the frontend.
enable_static=no
